name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # CPU-only torch: varsayilan PyPI paketi CUDA kutuphanelerini de getirir
      # ve runner'in diskini gereksiz yere doldurur.
      - name: Bagimliliklari kur
        working-directory: backend
        run: |
          pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install ruff

      # Yalnizca gercek hatalar: sozdizimi (E9) ve tanimsiz isim / kullanilmayan
      # import gibi pyflakes bulgulari (F). Bicim tercihleri CI'yi kirmiyor.
      - name: Lint
        working-directory: backend
        run: ruff check --select E9,F app eval tests

      # Birim testler + entegrasyon testi (gecici git deposu uzerinde gercek
      # chunk -> embedding -> Qdrant -> arama -> /ask akisi; LLM mock'lu,
      # bu yuzden API anahtari gerekmiyor).
      - name: Testler
        working-directory: backend
        run: python -m unittest discover tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Bagimliliklari kur
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # `tsc -b && vite build`: tip hatalari da burada yakalanir.
      - name: Derle
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Imajlar yalnizca derlenebildikleri dogrulansin diye kuruluyor,
      # hicbir yere push edilmiyor.
      - name: Backend imaji
        run: docker build -t repolens-backend ./backend

      - name: Frontend imaji
        run: docker build -t repolens-frontend ./frontend
